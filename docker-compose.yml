services:
  # ─── PostgreSQL 15 + PostGIS + pgvector (Single DB Service) ───
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: postgres:15-postgis-vector
    container_name: nwis-x-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nwis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nwis_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-nwis_x}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nwis} -d ${POSTGRES_DB:-nwis_x}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
