# NWIS-X Docker Compose — SIH26121 (Oil India Ltd)
# Full-stack: PostGIS + pgvector | FastAPI Backend | React Frontend
#
# Usage:
#   docker compose up --build        # Build & start all services
#   docker compose up -d             # Detached mode
#   docker compose down -v           # Tear down with volumes

version: "3.9"

services:
  # ─── PostGIS + pgvector Database ───
  db:
    image: pgvector/pgvector:pg16
    container_name: nwis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nwis_x
      POSTGRES_USER: nwis_admin
      POSTGRES_PASSWORD: nwis_secure_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwis_admin -d nwis_x"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nwis-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://nwis_admin:nwis_secure_2026@db:5432/nwis_x
      SECRET_KEY: nwis-x-sih26121-secret-key-oil-india-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      CORS_ORIGINS: "http://localhost:5173,http://localhost:80,http://frontend:80"
      # LLM Configuration (optional — falls back to deterministic mode)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      LLM_TIMEOUT_SECONDS: "3.0"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/synthetic_data:/app/synthetic_data:ro
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── React Frontend (Vite build → nginx) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nwis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
