version: "3.8"

services:
  # ─── PostgreSQL 15 + PostGIS + pgvector (Single DB Service) ───
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: postgres:15-postgis-vector
    container_name: nwis-x-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nwis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nwis_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-nwis_x}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nwis} -d ${POSTGRES_DB:-nwis_x}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── FastAPI Core Backend ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nwis-x-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nwis}:${POSTGRES_PASSWORD:-nwis_secret_change_me}@db:5432/${POSTGRES_DB:-nwis_x}
      SECRET_KEY: ${SECRET_KEY:-nwis_super_secret_jwt_key_sih26121_oil_india}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./synthetic_data:/synthetic_data:ro

  # ─── React + Vite Frontend ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nwis-x-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
    driver: local
