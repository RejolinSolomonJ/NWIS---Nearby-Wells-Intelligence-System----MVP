services:
  - type: web
    name: nwis-backend
    runtime: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nwis-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_TIMEOUT_SECONDS
        value: "3.0"

databases:
  - name: nwis-db
    plan: free
    region: oregon
    postgresMajorVersion: 16
